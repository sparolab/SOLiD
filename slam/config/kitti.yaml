# KITTI / Velodyne HDL-64E (vertical FOV +2.0 ~ -24.8 deg).
# Shared by the ROS 1 node, the ROS 2 node and the Mac tool.

solid:                  # SOLiD descriptor (same keys as python/solid/profiles)
  fov_up: 2.0           # deg, upper vertical FOV
  fov_down: -24.8       # deg, lower vertical FOV
  num_angle: 60         # A-SOLiD bins (yaw)
  num_range: 40         # R-SOLiD bins (range)
  num_height: 32        # elevation bins
  min_range: 3.0        # m
  max_range: 80.0       # m
  voxel_size: 0.4       # m, <= 0 disables downsampling
  use_weight: false     # true: points weighted by `input.weight_field`
  knn: 30               # KD-tree neighbours re-scored per query
  min_similarity: 0.0

keyframe:
  dist: 1.0             # m, new keyframe after this much translation
  angle_deg: 10.0       # deg, ... or this much rotation

submap:
  scans: 1              # scans merged into each keyframe's descriptor (1 = single scan)
  max_dist: 0.0         # m, only merge scans within this travel distance (0 = no limit)

loop:
  exclude_recent: 50    # skip the latest N keyframes when searching
  min_score: 0.99       # min R-SOLiD cosine similarity (KITTI 00: precision 1.00, recall 0.80)
  max_candidates: 1     # candidates reported per keyframe

input:
  cloud_in_world: false # true if the cloud is already in the odometry frame
  weight_field: ""      # per-point weight field, "" = occupancy
