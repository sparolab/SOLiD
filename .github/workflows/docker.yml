# Docker images on GitHub Container Registry: ghcr.io/sparolab/solid:{noetic,humble}
# (plus :<version>-noetic / :<version>-humble on a release).
name: Docker

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  image:
    name: ${{ matrix.distro }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        distro: [noetic, humble]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: |
          IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/solid
          T="$IMG:${{ matrix.distro }}"
          if [ "${{ github.event_name }}" = release ]; then T="$T,$IMG:${GITHUB_REF_NAME#v}-${{ matrix.distro }}"; fi
          echo "tags=$T" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.distro }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=SOLiD ${{ matrix.distro }}: solid_ros and solid_multi_session
            org.opencontainers.image.licenses=BSD-3-Clause
          cache-from: type=gha,scope=${{ matrix.distro }}
          cache-to: type=gha,mode=max,scope=${{ matrix.distro }}
