# SOLiD profile: 4D radar (sparse, RCS/power weighting).
# Points are few & noisy → coarse height binning, no voxel downsample, and use
# per-point weight (RCS/power) instead of occupancy. Doppler dynamic-point
# removal should be done by the wrapper before extract(). Tune per sensor.
fov_up: 15.0
fov_down: -15.0
num_angle: 60
num_range: 40
num_height: 8
min_range: 0.5
max_range: 60.0
voxel_size: 0.0        # no downsample (already sparse)
use_weight: true       # weight bins by RCS/power
knn: 30
min_similarity: 0.0
