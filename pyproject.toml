[build-system]
requires = ["scikit-build-core>=0.8", "pybind11>=2.10"]
build-backend = "scikit_build_core.build"

[project]
name = "solid-descriptor"
version = "2.0.1"
description = "SOLiD: Spatially Organized and Lightweight Global Descriptor (C++ core + pure-Python)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "BSD-3-Clause" }
dependencies = ["numpy", "pyyaml"]

[project.urls]
Homepage = "https://github.com/sparolab/SOLiD"

[tool.scikit-build]
# Package source lives in python/solid → import name `solid`.
# Non-.py data (profiles/*.yaml) under the package is included automatically.
wheel.packages = ["python/solid"]
cmake.version = ">=3.16"
minimum-version = "0.8"
# Source distribution: only what the build needs (the C++ library, the bindings, the package).
sdist.exclude = ["/thirdparty", "/slam", "/tools", "/docker", "/fig", "/appendix", "/docs", "/.github", "*.gif", "*.png", "*.pdf"]

# One-line install works from the repo root (cpp/ is in the build tree):
#   pip install .                                  # from a clone
#   pip install git+https://github.com/sparolab/SOLiD.git

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux* *i686* *-win32"
test-command = "python -c \"import solid, numpy as np; d = solid.Extractor(solid.load_config('lidar_velodyne')).extract((np.random.rand(3000, 3).astype('float32') - 0.5) * 50); print(solid.__version__, solid.backend)\""

[tool.cibuildwheel.linux]
# Eigen headers for the manylinux image
before-all = "curl -sL https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.tar.gz | tar xz -C /tmp && cmake -S /tmp/eigen-3.4.0 -B /tmp/eigen-build -DBUILD_TESTING=OFF -DEIGEN_BUILD_DOC=OFF && cmake --install /tmp/eigen-build"

[tool.cibuildwheel.macos]
before-all = "brew install eigen"
